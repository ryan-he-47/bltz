# bltz authoritative config (twin-scale targets from docs/01-design.md §12)
data:
  dataset: fineweb-edu-sample-10BT
  cache_dir: data/fineweb10b
  n_patches: 512          # S patches per sequence
  val_fraction: 0.001

segment:
  l_max: 16
  p_split: 0.1
  p_merge: 0.1

model:
  d_byte: 384
  d_pos: 64
  d_enc: 512
  enc_layers: 2
  enc_heads: 4             # 8→4(2026-09-14 用户拍板,保守效率砍)
  inducing: 8              # 16→8(同批;诱导注意力开销减半)
  enc_grouped: true        # T1' 长度分组重打包(2026-09-14 深夜拍板;逐元等价,tests/test_enc_grouped.py 对拍)
  d_model: 768
  bb_layers: 12
  bb_heads: 12
  ffn_mult: 4
  grad_ckpt: false        # gradient checkpointing escape hatch (batch 16 以上需要)
  head_delta_dim: 64
  head_hidden: 1536
  head_depth: 4
  head_type: film         # 常驻默认头(2026-09-15 升默认,2026-09-16 拍板定常驻;concat 保留为选项)
  k_max: 48               # = n_patches_ahead * l_max

loss:
  n_patches_ahead: 3      # n: cover 3 future patches (D4)
  lam: 0.5                # patch-to-patch geometric decay (D4)
  query_chunk: 200000
  head_grad_ckpt: true    # film 默认头配套(batch16 显存安全;commit 9129f40)

train:
  steps: 20000
  batch: 8                # 8GB 本机标定(2026-09-08, docs/06): 32 OOM, 16 分配器抖动, 8 稳妥
  lr: 4.0e-4
  warmup: 1000
  schedule: wsd
  decay_frac: 0.4
  final_frac: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  wd: 0.1
  clip: 1.0
  spike_skip: 10.0
  bf16: true
  seed: 1234
  ckpt_dir: checkpoints/twin
  log_every: 50
  ckpt_every: 250           # ~50min autosave(硬杀/断电最坏损失); 优雅中断走 STOP/SIGINT 即存即退
  milestone_every: 5000     # WSD decay-on-demand 里程碑快照(用户拍板稀疏化 2026-09-13;永久保留,weight-only ~0.55GB/份)
  val_every: 1000

infer:
  m_max: 16
  theta_stop: 1.5
  temperature: 0.0
