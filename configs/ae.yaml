# v2 S0: byte-string autoencoder prototype (docs/32 S0). Start config: 32-256.
data:
  cache_dir: data/cache_dryrun
  pool_sequences: 407        # all of dryrun
  val_frac: 0.05             # held-out strings for exact-match/geometry
  stream: false              # true = full-cache streaming (v2 cache, no pool)

seg:
  l_max: 32
  p_disagree: 0.5            # baked once per sequence (single-pass equivalence)
  tok_dir: data/qwen35_tokenizer

typo:                       # 错别字簇增强(docs/32 工具箱 #2;p=0 关闭)
  p: 0.0
  freq_throttle: true       # top-N 高频串 p*freq_scale(常见短串少增强)
  freq_seqs: 256
  freq_topk: 30000
  freq_scale: 0.25
  two_edit_p: 0.15          # 85% 单编辑 / 15% 双编辑
  ops: [0.40, 0.20, 0.15, 0.15, 0.10]   # 替换/删除/重复/交换/大小写

model:
  d_byte: 192
  d_pos: 64                  # within-patch position CONCAT (order visible)
  enc_width: 256
  enc_layers: 2
  enc_heads: 4
  inducing: 8
  l_max: 32
  d_emb: 48                  # S0 网格裁决:48-256 为基座(2026-09-18 拍板)
  d_delta: 64
  dec_hidden: 256
  dec_depth: 3
  film_layers: 2

train:
  steps: 20000
  batch: 256                 # strings per step
  lr: 1.0e-3
  warmup: 500
  decay_frac: 0.3
  final_frac: 0.1
  betas: [0.9, 0.95]
  wd: 0.01
  clip: 1.0
  bf16: true
  seed: 1234
  ckpt_dir: checkpoints/ae_48_256
  log_every: 100
  ckpt_every: 2000
