# v2 backbone POC (docs/32 S3): frozen AE (48-256) + backbone + MDN, 60k WSD
# (2026-09-18 拍板: skip the 20k first-read, WSD allows early stop anytime).
data:
  cache_dir: data/cache_dryrun     # cluster override -> fineweb10b_v2
  n_patches: 512
model:
  d_emb: 48                        # S0 verdict: 48-256
  adapter_width: 2048              # wide nonlinear input adapter (拍板)
  d_model: 768
  bb_layers: 12
  bb_heads: 12
  ffn_mult: 4
  grad_ckpt: false
  mdn_hidden: 1024                 # two-layer nonlinear buffer before GMM params
  n_comp: 64
  sigma_floor: 0.05                # MDN σ 坍缩防护(2026-09-19 拍板:表达力优先;A/B 验证 gn 峰值 176,红线 2000)
train:
  ae_ckpt: checkpoints/ae_48_256/best.pt
  steps: 60000
  batch: 16
  lr: 4.0e-4
  warmup: 1000
  decay_frac: 0.4
  final_frac: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  wd: 0.1
  clip: 1.0
  spike_skip: 10.0
  bf16: true                       # cluster: --set train.bf16=false (fp16+scaler)
  seed: 1234
  ckpt_dir: checkpoints/v2_poc
  log_every: 50
  ckpt_every: 250
  milestone_every: 5000
